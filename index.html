<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MirageUI Demos</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111827;
      color: #e5e7eb;
    }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 3rem 1.25rem;
    }
    h1 { margin-top: 0; }
    .subtitle { color: #9ca3af; margin-bottom: 2rem; }
    .demo-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 1rem; }
    .demo-card {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 10px;
      padding: 1rem 1.25rem;
    }
    .demo-card a {
      color: #93c5fd;
      font-weight: 600;
      text-decoration: none;
      font-size: 1.05rem;
    }
    .demo-card a:hover { text-decoration: underline; }
    .demo-card p { margin: .5rem 0 0; color: #d1d5db; }
    footer { margin-top: 2.5rem; font-size: .875rem; color: #9ca3af; }
    footer a { color: #93c5fd; }
  </style>
</head>
<body>
  <main>
    <h1>MirageUI Demo Pages</h1>
    <p class="subtitle">Published WebAssembly demos built from the private Mirage source repository.</p>
    <ul class="demo-list">
      <li class="demo-card">
        <a href="/MirageUI/demos/controls-sample/">Controls.Sample (Fluent)</a>
        <p>Mirage wrapper around upstream dotnet/maui Controls.Sample pages.</p>
      </li>
    </ul>
    <footer>
      <p>License notices: <a href="/MirageUI/THIRD_PARTY_NOTICES.md">THIRD_PARTY_NOTICES.md</a></p>
    </footer>
  </main>
</body>
</html>
